# 도파민 사이트 구성.
#
# 운영 서버에서는 blog20260819(강남호빠) 의 nginx 가 이 사이트까지 함께 서빙한다.
# 그래서 기본으로 뜨는 서비스는 admin 하나뿐이고, nginx/certbot 은
# `--profile standalone` 을 줄 때만 뜬다. (같은 서버에서 80 포트가 겹치지 않게 한다)
#
#   같은 서버에 얹는 경우:  docker compose up -d --build admin
#   이 프로젝트 단독 운영:  docker compose --profile standalone up -d
services:
  # 빌드 전용 one-shot 컨테이너. `--profile build` 를 줄 때만 실행된다.
  astro:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /src
    # 산출물이 root 소유로 생성되지 않도록 호스트 사용자로 실행한다
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      SITE_URL: ${BASE_URL}
      TZ: ${TZ:-Asia/Seoul}
      npm_config_cache: /tmp/npm
    volumes:
      - ./:/src
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  # 관리 페이지. 사이트 내용을 직접 읽고 쓰며,
  # 변경 사항은 .admin/rebuild.request 파일로 호스트 감시 스크립트에 알린다.
  admin:
    build: ./admin
    # 다른 compose 프로젝트의 nginx 가 이름으로 찾아갈 수 있게 고정한다
    container_name: dopamin-admin
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${ADMIN_SECRET_KEY}
      DATA_FILE: /data/site.json
      GALLERY_DIR: /gallery
      STATE_DIR: /state
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./content:/data
      - ./public/images/gallery:/gallery
      - ./.admin:/state
    networks:
      - web
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      # python:slim 이미지에는 wget/curl 이 없으므로 파이썬으로 확인한다
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["standalone"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - web
    depends_on:
      - admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot
    profiles: ["standalone"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 갱신에 성공하면 .renewed 표시 파일을 남긴다.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook "touch /etc/letsencrypt/.renewed" --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

# 강남호빠 서버의 nginx 와 통신하기 위한 공유 네트워크.
# 서버에서 한 번만 만든다:  docker network create web
networks:
  web:
    external: true
