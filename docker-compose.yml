services:
  # 빌드 전용 one-shot 컨테이너. `--profile build` 를 줄 때만 실행된다.
  astro:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /src
    # 산출물이 root 소유로 생성되지 않도록 호스트 사용자로 실행한다
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      SITE_URL: ${BASE_URL}
      TZ: ${TZ:-Asia/Seoul}
      npm_config_cache: /tmp/npm
    volumes:
      - ./:/src
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 도메인 연결 전에는 80 으로 두어 IP 만으로 접속되게 한다.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 갱신에 성공하면 .renewed 표시 파일을 남긴다.
    # 호스트의 watch-changes.sh 가 이 파일을 보고 nginx 에 재적용을 지시한다.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook "touch /etc/letsencrypt/.renewed" --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

  # 관리 페이지. 사이트 내용을 직접 읽고 쓰며,
  # 변경 사항은 .admin/rebuild.request 파일로 호스트 감시 스크립트에 알린다.
  admin:
    build: ./admin
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${ADMIN_SECRET_KEY}
      DATA_FILE: /data/site.json
      GALLERY_DIR: /gallery
      STATE_DIR: /state
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./content:/data
      - ./public/images/gallery:/gallery
      - ./.admin:/state
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
